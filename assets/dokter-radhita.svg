<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Ilustrasi animasi profil dokter hewan">
<style>
.b{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 3.4s ease-in-out infinite}
.eye{animation:blink 4.6s infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.tw{animation:tw 2.8s ease-in-out infinite}
.tw2{animation:tw 2.8s ease-in-out 1.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7) rotate(45deg)}50%{opacity:1;transform:scale(1.1) rotate(45deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><clipPath id="c"><circle cx="100" cy="100" r="96"/></clipPath></defs>
<circle cx="100" cy="100" r="98" fill="#f7e4f1" stroke="#ecd6e5" stroke-width="2"/>
<g clip-path="url(#c)">
  <path d="M26 206C26 152 62 138 100 138C138 138 174 152 174 206Z" fill="#fff" stroke="#ecd6e5" stroke-width="2"/>
  <path d="M80 140L100 170L120 140Z" fill="#b858a0"/>
  <path d="M70 144C66 172 82 186 100 186C118 186 134 172 130 144" fill="none" stroke="#8f3a7b" stroke-width="4" stroke-linecap="round"/>
  <circle class="b pulse" cx="100" cy="186" r="6" fill="#a8478f"/>
  <g class="bob">
    <path d="M63 98C56 48 144 48 137 98C142 132 130 152 118 152L82 152C70 152 58 132 63 98Z" fill="#3a2a33"/>
    <rect x="89" y="116" width="22" height="26" rx="8" fill="#f6d0b3"/>
    <ellipse cx="70" cy="94" rx="5" ry="8" fill="#f6d0b3"/><ellipse cx="130" cy="94" rx="5" ry="8" fill="#f6d0b3"/>
    <ellipse cx="100" cy="92" rx="30" ry="34" fill="#f6d0b3"/>
    <path d="M69 88C72 62 128 62 131 88C118 77 106 73 100 73C94 73 82 77 69 88Z" fill="#3a2a33"/>
    <ellipse class="b eye" cx="87" cy="96" rx="3.2" ry="4.2" fill="#2b2230"/>
    <ellipse class="b eye" cx="113" cy="96" rx="3.2" ry="4.2" fill="#2b2230"/>
    <circle cx="80" cy="106" r="5" fill="#e98fb8" opacity=".45"/><circle cx="120" cy="106" r="5" fill="#e98fb8" opacity=".45"/>
    <path d="M91 108Q100 117 109 108" fill="none" stroke="#8f3a7b" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</g>
<rect class="b tw" x="150" y="30" width="12" height="12" rx="2" fill="#b858a0"/>
<rect class="b tw2" x="40" y="48" width="8" height="8" rx="2" fill="#b858a0"/>
</svg>
